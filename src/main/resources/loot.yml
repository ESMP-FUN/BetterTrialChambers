# Notes:
# - type: The Material name from Bukkit
# - amount-min/amount-max: Random amount between these values
# - weight: Probability weight (higher = more common)
# - name: Optional custom display name (supports color codes)
# - lore: Optional lore lines (supports color codes)
# - enchantments: Optional list of "ENCHANTMENT:LEVEL"
#
# ============================================
# MULTI-POOL LOOT SYSTEM (NEW!)
# ============================================
# Like vanilla, you can create multiple loot pools that each roll independently.
# This is OPTIONAL - the single-pool format above still works!
#
# Example: Vanilla-like loot with common/rare/unique pools
#
#  vanilla-style:
#    pools:
#      # Common pool - always gives 2-3 basic items
#      - name: common
#        min-rolls: 2
#        max-rolls: 3
#        weighted-items:
#          - type: IRON_INGOT
#            amount-min: 3
#            amount-max: 7
#            weight: 30.0
#          - type: GOLD_INGOT
#            amount-min: 2
#            amount-max: 5
#            weight: 25.0
#          - type: ARROW
#            amount-min: 16
#            amount-max: 32
#            weight: 20.0
#          - type: BREAD
#            amount-min: 5
#            amount-max: 10
#            weight: 25.0
#
#      # Rare pool - gives 1-2 valuable items
#      - name: rare
#        min-rolls: 1
#        max-rolls: 2
#        weighted-items:
#          - type: DIAMOND
#            amount-min: 1
#            amount-max: 3
#            weight: 15.0
#          - type: EMERALD
#            amount-min: 3
#            amount-max: 8
#            weight: 20.0
#          - type: GOLDEN_APPLE
#            amount-min: 1
#            amount-max: 1
#            weight: 12.0
#          - type: ENCHANTED_BOOK
#            amount-min: 1
#            amount-max: 1
#            weight: 8.0
#            enchantments:
#              - "SHARPNESS:3"
#
#      # Unique pool - rare chance at 0-1 special item
#      - name: unique
#        min-rolls: 0
#        max-rolls: 1
#        weighted-items:
#          - type: ENCHANTED_GOLDEN_APPLE
#            amount-min: 1
#            amount-max: 1
#            weight: 3.0
#            name: "&6&lRare Treasure"
#          - type: NETHERITE_INGOT
#            amount-min: 1
#            amount-max: 1
#            weight: 2.0
#          - type: ELYTRA
#            amount-min: 1
#            amount-max: 1
#            weight: 1.0
#            name: "&5&lUltra Rare!"
#
# Benefits of multi-pool system:
# - Each pool rolls independently (more predictable loot)
# - Better control over loot distribution (common vs rare vs unique)
# - Matches vanilla Trial Chamber behavior
# - Can have 0-roll pools for bonus/rare items
#
# Note: GUI loot editor supports both legacy and multi-pool formats!
# ============================================
# ROLL MODE: weighted (default) vs independent   (v2.0.2)
# ============================================
# Each table (or each pool) can pick how its weighted-items are drawn, via an
# optional `mode:` key. Omit it for the classic behaviour.
#
#   mode: weighted     (DEFAULT)
#     Each opening makes min-rolls..max-rolls draws; each draw picks exactly ONE
#     item with probability weight / (sum of weights). Weights are RELATIVE — only
#     their ratio matters — and the same item can drop on multiple draws.
#
#   mode: independent
#     Every enabled item rolls ON ITS OWN: it drops when random(0-100) < weight,
#     so here `weight` is read as that item's absolute 0-100% chance. Chances are
#     independent and do NOT need to total 100%. min-rolls/max-rolls (and the LUCK
#     bonus) are ignored. Optionally add `max-items: N` to keep at most N of the
#     items that passed (chosen at random) — 0 or omitted = no cap. Ideal for large
#     tables where hand-balancing relative weights is impractical.
#
# Example — a 3-item independent pool where each item has its own drop rate and at
# most 2 can drop per opening:
#
#  loot-per-item:
#    mode: independent
#    max-items: 2
#    min-rolls: 1        # ignored in independent mode, but kept for easy switching
#    max-rolls: 1
#    weighted-items:
#      - type: DIAMOND
#        amount-min: 1
#        amount-max: 2
#        weight: 40.0     # 40% chance to drop
#      - type: NETHERITE_SCRAP
#        amount-min: 1
#        amount-max: 1
#        weight: 10.0     # 10% chance
#      - type: EMERALD
#        amount-min: 3
#        amount-max: 6
#        weight: 75.0     # 75% chance
#
# In the GUI: the loot editor has a "Roll Mode" toggle; in independent mode each
# item's Shift+Left/Right adjusts its own % and a "Max Items" control replaces
# "Draws per Opening".
# ============================================
# WANT SOMETHING OTHER THAN VANILLA?
# ============================================
# The two tables at the top of this file are already Minecraft's own Trial
# Chamber loot, so there is nothing to copy in to "get vanilla". Edit them in
# place, or in game through the loot editor, and your changes are saved back
# here.
#
# To add a table of your own, give it a name and list it alongside them:
#
#   loot-tables:
#     default: ...
#     ominous-default: ...
#     my-boss-room:
#       min-rolls: 1
#       max-rolls: 2
#       weighted-items:
#         - type: NETHERITE_INGOT
#           amount-min: 1
#           amount-max: 1
#           weight: 5.0
#
# Then point a chamber at it: open that chamber in the menu, go to Settings,
# and set its loot override to the name you chose.
# ============================================
# ADVANCED LOOT FEATURES (NEW!)
# ============================================
# Advanced features to create vanilla-like loot:
# - Tipped arrows with potion effects
# - Potions with custom levels (including ominous potions)
# - Enchantment randomization (random level ranges)
# - Random enchantment pools (pick one random enchantment)
# - Variable durability (damaged items)
#
# ====== TIPPED ARROWS ======
# Tipped arrows use the TIPPED_ARROW material + potion-type
#
#      - type: TIPPED_ARROW
#        amount-min: 8
#        amount-max: 16
#        weight: 15.0
#        potion-type: POISON  # Any PotionType: POISON, HEALING, STRENGTH, etc.
#        potion-level: 1      # 0 = Level I, 1 = Level II, 2 = Level III, etc.
#
#      - type: TIPPED_ARROW
#        amount-min: 8
#        amount-max: 16
#        weight: 10.0
#        potion-type: SLOWNESS
#        potion-level: 3      # Level IV Slowness!
#
#      - type: TIPPED_ARROW
#        amount-min: 4
#        amount-max: 8
#        weight: 12.0
#        potion-type: POISON
#        potion-level: 1
#        effect-duration: 1200  # OPTIONAL: Override duration (1200 ticks = 60s). If not specified, auto-calculates as 1/8 of potion duration (vanilla behavior)
#        name: "&2Long-Lasting Poison Arrow"
#
# ====== POTIONS WITH LEVELS ======
# Create potions with specific effect levels
#
#      - type: POTION
#        amount-min: 1
#        amount-max: 2
#        weight: 12.0
#        potion-type: STRENGTH
#        potion-level: 1      # Strength II
#
#      - type: SPLASH_POTION
#        amount-min: 1
#        amount-max: 1
#        weight: 8.0
#        potion-type: HEALING
#        potion-level: 1      # Instant Health II
#
#      - type: LINGERING_POTION
#        amount-min: 1
#        amount-max: 1
#        weight: 6.0
#        potion-type: HARMING
#        potion-level: 1      # Instant Damage II
#
# ====== OMINOUS BOTTLES (BAD OMEN) ======
# Ominous Bottles are the real minecraft:ominous_bottle item (v1.7.1+): they
# give Bad Omen when drunk, triggering an Ominous Trial. They can ONLY hold
# Bad Omen — that's a game rule, not a plugin limit. In vanilla, normal
# vaults drop them at levels I-II and ominous vaults at III-V, with the
# level rolled randomly per drop.
#
#      # Fixed level:
#      - type: OMINOUS_BOTTLE
#        amount-min: 1
#        amount-max: 1
#        weight: 5.0
#        potion-level: 2               # 0=I, 1=II, 2=III, 3=IV, 4=V
#
#      # Random level per drop (like vanilla — this is the ominous-vault range):
#      - type: OMINOUS_BOTTLE
#        amount-min: 1
#        amount-max: 1
#        weight: 2.0
#        potion-level-min: 2           # Bad Omen III…
#        potion-level-max: 4           # …to V, rolled each time
#
# Note: custom names/lore work on ominous bottles too, but aren't needed —
# the real item already displays as "Ominous Bottle" with its own texture.
#
# For OTHER special effects (HERO_OF_THE_VILLAGE, LUCK, GLOWING, etc.) use a
# POTION with custom-effect-type — those have no dedicated item in the game:
#
#      - type: POTION
#        weight: 2.0
#        custom-effect-type: HERO_OF_THE_VILLAGE
#        potion-level: 1
#        name: "&6&lHero's Draught"
#
# effect-duration behavior:
# - For potion-type items: Auto-calculates based on potion type (TIPPED_ARROW = 1/8 of potion duration)
# - For custom-effect-type items: Uses hardcoded defaults (can be overridden)
# - Always optional: Specify to override the automatic/default duration
#
# ====== ENCHANTMENT RANGES ======
# Apply enchantments with random levels (like vanilla!)
#
#      - type: DIAMOND_SWORD
#        amount-min: 1
#        amount-max: 1
#        weight: 10.0
#        enchantment-ranges:  # Enchantment will have random level in range
#          - "SHARPNESS:1:5"  # Sharpness I to V
#          - "LOOTING:1:3"    # Looting I to III
#
#      - type: DIAMOND_PICKAXE
#        amount-min: 1
#        amount-max: 1
#        weight: 8.0
#        enchantment-ranges:
#          - "EFFICIENCY:3:5"  # Efficiency III to V
#          - "FORTUNE:1:3"     # Fortune I to III
#
# ====== RANDOM ENCHANTMENT POOL ======
# Pick ONE random enchantment from a pool (great for variety!)
#
#      - type: ENCHANTED_BOOK
#        amount-min: 1
#        amount-max: 1
#        weight: 15.0
#        random-enchantment-pool:  # Will pick ONE of these enchantments
#          - "SHARPNESS:3:5"       # Either Sharpness III-V
#          - "PROTECTION:2:4"      # OR Protection II-IV
#          - "UNBREAKING:2:3"      # OR Unbreaking II-III
#          - "EFFICIENCY:3:5"      # OR Efficiency III-V
#          - "MENDING:1:1"         # OR Mending I
#
#      - type: DIAMOND_CHESTPLATE
#        amount-min: 1
#        amount-max: 1
#        weight: 5.0
#        random-enchantment-pool:  # Armor with ONE random enchantment
#          - "PROTECTION:3:4"
#          - "BLAST_PROTECTION:3:4"
#          - "PROJECTILE_PROTECTION:3:4"
#          - "FIRE_PROTECTION:3:4"
#
# ====== VARIABLE DURABILITY ======
# Drop items with random damage (like vanilla treasure!)
#
#      - type: DIAMOND_SWORD
#        amount-min: 1
#        amount-max: 1
#        weight: 10.0
#        enchantments:
#          - "SHARPNESS:4"
#        durability-min: 200  # Item will have 200-800 damage
#        durability-max: 800  # (Diamond sword has 1561 max durability)
#        name: "&bUsed Diamond Sword"
#        lore:
#          - "&7Found in a Trial Chamber"
#          - "&7Slightly worn but still powerful!"
#
#      - type: NETHERITE_PICKAXE
#        amount-min: 1
#        amount-max: 1
#        weight: 3.0
#        enchantment-ranges:
#          - "EFFICIENCY:4:5"
#          - "FORTUNE:2:3"
#        durability-min: 500
#        durability-max: 1500
#        name: "&5Veteran's Pickaxe"
#
# ====== GOAT HORNS (8 VARIANTS) ======
# Goat Horns have 8 different instrument variants, each playing a unique sound.
# Use the "instrument" field to specify which variant to drop.
#
#      - type: GOAT_HORN
#        amount-min: 1
#        amount-max: 1
#        weight: 8.0
#        instrument: PONDER  # The "Ponder" goat horn sound
#        name: "&6Horn of Contemplation"
#
#      - type: GOAT_HORN
#        amount-min: 1
#        amount-max: 1
#        weight: 5.0
#        instrument: DREAM   # The rarest "Dream" goat horn sound
#        name: "&5&lDreamer's Horn"
#        lore:
#          - "&7A rare horn that echoes"
#          - "&7through the chambers"
#
# Available instruments (8 variants):
#   PONDER  - Found naturally in regular goats
#   SING    - Found naturally in regular goats
#   SEEK    - Found naturally in regular goats
#   FEEL    - Found naturally in regular goats
#   ADMIRE  - Found only in screaming goats (rare!)
#   CALL    - Found only in screaming goats (rare!)
#   YEARN   - Found only in screaming goats (rare!)
#   DREAM   - Found only in screaming goats (rare!)
#
# Note: You can use full names like "PONDER_GOAT_HORN" or short names like "PONDER"
#
# ====== COMBINING EVERYTHING ======
# You can mix and match any/all features!
#
#      - type: DIAMOND_SWORD
#        amount-min: 1
#        amount-max: 1
#        weight: 5.0
#        name: "&6&lLegendary Blade"
#        lore:
#          - "&7Forged in ancient trials"
#          - "&7Carries the mark of champions"
#        enchantment-ranges:      # Fixed enchantment with random level
#          - "SHARPNESS:4:5"
#        random-enchantment-pool: # PLUS one random enchantment
#          - "LOOTING:2:3"
#          - "SWEEPING_EDGE:2:3"
#          - "FIRE_ASPECT:1:2"
#        durability-min: 100      # Slightly used
#        durability-max: 300
#
# ====== AVAILABLE POTION TYPES ======
# Use these for potion-type field:
# SPEED, SLOWNESS, STRENGTH, INSTANT_HEAL, INSTANT_DAMAGE, JUMP_BOOST,
# REGENERATION, RESISTANCE, FIRE_RESISTANCE, WATER_BREATHING, INVISIBILITY,
# NIGHT_VISION, WEAKNESS, POISON, WITHER, TURTLE_MASTER, SLOW_FALLING
#
# ====== NOTES ======
# - Fixed enchantments use: enchantments: ["ENCHANTMENT:LEVEL"]
# - Enchantment ranges use: enchantment-ranges: ["ENCHANTMENT:MIN:MAX"]
# - Random pool uses: random-enchantment-pool: ["ENCHANTMENT:MIN:MAX", ...]
# - You can combine fixed, ranges, AND random pool on the same item!
# - Durability values are damage (higher = more damaged)
# - Ominous potions are 1.21+ exclusive feature
# - All enchantment names: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/enchantments/Enchantment.html

# ============================================
# COMMAND REWARDS (ECONOMY & PERMISSIONS)
# ============================================
# Run console commands when a player opens a vault!
# Great for economy rewards, permissions, titles, or any command-based rewards.
#
# IMPORTANT: Command rewards are NOT added to weighted-items!
# They go in a separate "command-rewards" list at the pool level.
#
# ====== BASIC EXAMPLE ======
#  default:
#    min-rolls: 3
#    max-rolls: 5
#    weighted-items:
#      - type: DIAMOND
#        amount-min: 1
#        amount-max: 3
#        weight: 10.0
#
#    # Command rewards run with specified probability
#    command-rewards:
#      - weight: 25.0              # 25% chance
#        commands:
#          - "eco give {player} 1000"
#        display-name: "&6+1000 Coins"
#
#      - weight: 10.0              # 10% chance
#        commands:
#          - "lp user {player} permission set special.vault.bonus true"
#        display-name: "&5Special Permission Unlocked!"
#
# ====== MULTI-POOL WITH COMMANDS ======
#  premium-vault:
#    pools:
#      # Regular items pool
#      - name: items
#        min-rolls: 3
#        max-rolls: 5
#        weighted-items:
#          - type: DIAMOND
#            amount-min: 1
#            amount-max: 3
#            weight: 10.0
#
#      # Bonus rewards pool (commands)
#      - name: bonuses
#        min-rolls: 1
#        max-rolls: 1
#        command-rewards:
#          - weight: 50.0
#            commands:
#              - "eco give {player} 500"
#            display-name: "&6+500 Coins"
#
#          - weight: 30.0
#            commands:
#              - "eco give {player} 1000"
#            display-name: "&6+1000 Coins"
#
#          - weight: 15.0
#            commands:
#              - "eco give {player} 5000"
#              - "give {player} nether_star 1"
#            display-name: "&e&lJACKPOT! &6+5000 Coins"
#
#          - weight: 5.0
#            commands:
#              - "lp user {player} parent add vip"
#              - "eco give {player} 10000"
#              - "give {player} elytra 1"
#            display-name: "&5&lULTRA RARE! &dVIP Rank!"
#
# ====== AVAILABLE PLACEHOLDERS ======
# {player} - Player's name
# {uuid}   - Player's UUID
#
# ====== NOTES ======
# - Commands run as CONSOLE (OP permissions)
# - Weight is probability (higher = more likely)
# - Multiple commands execute in order
# - Player receives a message with the display-name
# - Works with Vault (economy), LuckPerms (permissions), any command
#
# ====== EXAMPLES ======
# Economy (requires Vault):
#   - "eco give {player} 1000"
#   - "eco take {player} 500"
#
# Permissions (LuckPerms):
#   - "lp user {player} permission set special.perk true"
#   - "lp user {player} parent add vip"
#
# Items:
#   - "give {player} diamond 64"
#
# Experience:
#   - "xp add {player} 1000"
#
# Titles:
#   - "title {player} title {\"text\":\"&6Rare Reward!\",\"color\":\"gold\"}"
#
# Multiple actions:
#   - "eco give {player} 5000"
#   - "give {player} elytra 1"
#   - "xp add {player} 500"

# ============================================================================
# ECONOMY (MONEY) REWARDS (v1.5.12+) — native Vault integration
# ============================================================================
# A cleaner, economy-plugin-agnostic alternative to `eco give` command rewards:
# pays money straight through the Vault API, so it works with EssentialsX, CMI,
# or any Vault economy provider without hardcoding a command. Requires Vault +
# an economy plugin; if none is installed the reward is simply skipped (other
# loot is unaffected).
#
# Put an `economy-rewards` list at the POOL level (or table level in the legacy
# single-pool format), exactly like `command-rewards`:
#
#  rich-vault:
#    min-rolls: 3
#    max-rolls: 5
#    weighted-items:
#      - type: DIAMOND
#        amount-min: 1
#        amount-max: 3
#        weight: 10.0
#    economy-rewards:
#      - weight: 100.0        # % chance this payout fires (100 = always)
#        min: 250.0           # random amount between min and max…
#        max: 1500.0
#        display-name: "Coins"   # optional, currently informational
#
#      - weight: 5.0          # 5% chance of a jackpot
#        amount: 10000.0      # a fixed payout (use `amount` instead of min/max)
#
# Notes:
# - `weight` is a 0-100 percent chance, independent per entry (same as command-rewards).
# - Use either `amount` (fixed) or `min`/`max` (random range).
# - The player gets a "You received <currency>" message on a successful deposit.
# - The deposit is done on the main thread; safe with EssentialsX/CMI economies.

# ============================================================================
# VANILLA / DATAPACK LOOT TABLE PASSTHROUGH (v1.5.7+)
# ============================================================================
# A pool entry can reference any loot table registered on the server — the
# vanilla trial chamber tables or one from your own datapack. When the entry
# is rolled, the referenced table is populated and EVERY item it generates is
# added to the drop (amount-min/max do not apply).
#
# Example — 30% of rolls defer to the real vanilla vault table:
#
#   my-table:
#     pools:
#       - name: main
#         min-rolls: 1
#         max-rolls: 1
#         weighted-items:
#           - type: VANILLA_TABLE
#             table: "minecraft:chests/trial_chambers/reward"
#             weight: 30.0
#           - type: DIAMOND
#             amount-min: 1
#             amount-max: 3
#             weight: 70.0
#
# Useful vanilla keys:
#   minecraft:chests/trial_chambers/reward            (normal vault)
#   minecraft:chests/trial_chambers/reward_ominous    (ominous vault)
#   minecraft:chests/trial_chambers/supply            (supply chests)
# Datapack tables work with their own namespace, e.g. "mypack:chambers/boss".
