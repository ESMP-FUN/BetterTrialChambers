# BetterTrialChambers Loot Tables

# ---------------------------------------------------------------------------
# Limiting how often a player can win an item ("redeemable")
# ---------------------------------------------------------------------------
# By default every item can be won again each time a chamber resets. To stop a
# special item (like an armour trim) from being farmed, add a "redeemable:" line
# to that item. The easiest way is the in-game menu: open the loot editor, click
# an item's amount page, and press the "How often can a player get this?" button
# to cycle through the choices. If you edit this file by hand, use one of:
#
#   redeemable: per-reset    (default) They can win it again after every reset.
#   redeemable: per-chamber  Each player wins it only ONCE from this chamber,
#                            even after resets. They can still get it from a
#                            different chamber.
#   redeemable: once         Each player wins it only ONCE, ever, anywhere.
#
# When the menu sets one of these, it also writes a hidden "redeem-id:" line -
# leave that line alone; it's how the plugin remembers who has already won it.
# ---------------------------------------------------------------------------

loot-tables:
  # These two tables are what a vault gives out, and out of the box they are
  # Minecraft's own Trial Chamber loot, item for item and chance for chance.
  # They were generated directly from the game's own files rather than typed
  # out by hand, so "the same as vanilla" means exactly that.
  #
  # Everything here is yours to change. Add items, remove items, change the
  # numbers; the plugin does not mind. If you want to start over, delete this
  # file and restart the server and a fresh copy appears.
  #
  # How a table works: a table has pools, and every pool is rolled separately,
  # so a vault's loot is the pools added together.
  #   min-rolls / max-rolls  how many items this pool gives (picked at random
  #                          between the two)
  #   chance                 how often the pool runs at all, from 0 to 1.
  #                          Leave it out and the pool always runs.
  #   weight                 how likely one item is compared to the others in
  #                          the same pool. Doubling a weight makes that item
  #                          come up twice as often. They do not need to add up
  #                          to anything in particular.
  # Normal vaults. Matches vanilla exactly.
  default:
    pools:
      # Pool 1: one item. Vanilla picks the rare list 80% of the time and the
      # common list the other 20%, then picks an item from whichever it chose.
      # There is no nesting here, so both lists sit in one pool with each
      # weight written as its share of 100. Rare weights sum to 80, common to 20.
