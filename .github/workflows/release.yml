name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      # One jar for every supported server. Gradle compiles with JDK 25 and
      # reads JDK 21's modules for the shrinking step, so it is told where both are.
      - name: Build
        run: ./gradlew build "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - name: Extract changelog section
        run: |
          awk '/^## \[/{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md || echo "See CHANGELOG.md" > RELEASE_NOTES.md

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" build/libs/BetterTrialChambers-*.jar --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}

      # Old "+mc26" and "+mc263" Modrinth versions stay as they are; servers on those
      # tracks fall back to this plain upload. Add new Minecraft versions to MC_VERSIONS.
      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ownTWGOH
          LOADERS: paper purpur folia
          MC_VERSIONS: 1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11 26.1 26.1.1 26.1.2 26.2 26.3
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="build/libs/BetterTrialChambers-$VERSION.jar"
          case "$VERSION" in
            *alpha*) TYPE=alpha ;;
            *beta*|*rc*) TYPE=beta ;;
            *) TYPE=release ;;
          esac
          python3 - "$VERSION" "$TYPE" > data.json <<'PY'
          import json, os, sys
          print(json.dumps({
              "project_id": os.environ["PROJECT_ID"],
              "version_number": sys.argv[1],
              "name": "Better Trial Chambers " + sys.argv[1],
              "version_type": sys.argv[2],
              "changelog": open("RELEASE_NOTES.md").read(),
              "loaders": os.environ["LOADERS"].split(),
              "game_versions": os.environ["MC_VERSIONS"].split(),
              "dependencies": [],
              "featured": True,
              "status": "listed",
              "file_parts": ["jar"],
              "primary_file": "jar",
          }))
          PY
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: ESMP-FUN/BetterTrialChambers release workflow" \
            -F "data=<data.json;type=application/json" \
            -F "jar=@$JAR;type=application/java-archive"
